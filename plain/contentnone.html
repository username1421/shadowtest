<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script src="https://elfsightcdn.com/platform.js" async></script>
  <div id="widget-root" data-elfsight-app-lazy></div>
  <script>
    (() => {
      const widgetRoot = document.querySelector("#widget-root");

      if (!widgetRoot) {
        console.warn('Widget root not found');

        return;
      }

      const params = new URLSearchParams(location.search);
      const id = params.get("id");

      if (!id) {
        console.warn("No widget ID provided");
        widgetRoot.innerHTML = `<p style="color:#aaa; font-size:13px; border:none; padding:0; margin:0;">No widget ID provided. Add <code>?id=&lt;widget-id&gt;</code> to the URL.</p>`;

        return;
      }

      widgetRoot.classList.add(`elfsight-app-${id}`);

      const links = ["contentabove.html", "contentbelow.html", "contentboth.html"];
      
      const wrapper = document.createElement('div');

      links.forEach((link) => {
        const anchor = document.createElement('a');
        anchor.classList.add('shmlink');
        anchor.href = `${link}?id=${id}`;
        anchor.textContent = link.replace('.html', '');
        wrapper.append(anchor);
      });

      widgetRoot.after(wrapper);
    })()
  </script>
  <style>
    .shmlink {
      margin: 0 10px;
    }
  </style>
</body>

</html>
